<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Header</title>
</head>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    height:800px;
    display:flex;
    flex-direction:column;
}

/* Header */
header{
    width:100%;
    background:#ffffff;
    padding:18px 60px;
    box-shadow:10px 10px 10px gray;
    display:flex;
    justify-content:space-between;
    align-items:center;
    
}
nav{
    display:flex;
    gap:30px;
}
footer{
    margin-top:auto;
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
    font-size:15px;
}

</style>
<body>

<header>
    <h3>
    Arena Animation 
    <br>
    GTB Nager
    </h3>
    
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>

    </nav>
</header>

</body>
<footer>
    <p>© 2026 Animation Institute. All Rights Reserved.</p>
</footer>

</html>
